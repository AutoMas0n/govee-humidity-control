[package]
name = "govee-ble"
version = "0.1.0"
edition = "2021"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
aes = "0.8"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"